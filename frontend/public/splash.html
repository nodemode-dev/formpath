<!DOCTYPE html>
<html lang="en">
<head>

  <title>formpath</title>

</head>
<body><svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 32 32" role="img" aria-label="formpath">

    <linearGradient id="sp-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32"><stop offset="0" stop-color="#1C1C22"/><stop offset="1" stop-color="#0A0A0D"/></linearGradient>
    <radialGradient id="sp-bloom" gradientUnits="userSpaceOnUse" cx="16" cy="17" r="12"><stop offset="0" stop-color="#9A5CFF" stop-opacity="0.22"/><stop offset="1" stop-color="#9A5CFF" stop-opacity="0"/></radialGradient>

  </defs>
  <rect width="32" height="32" rx="7" ry="7" fill="url(#sp-tile)"/>
  <rect width="32" height="32" rx="7" ry="7" fill="url(#sp-bloom)"/>
  <path d="M6.5 23.5 L11 12.2" stroke="#DDD9D2" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M25.5 8.5 L21 19.8" stroke="#DDD9D2" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.85"/>

  <circle cx="11" cy="12.2" r="1.25" fill="url(#sp-metal)"/>
  <circle cx="21" cy="19.8" r="1.25" fill="url(#sp-metal)"/>
  <rect x="4.4" y="21.4" width="4.2" height="4.2" rx="0.9" fill="url(#sp-metal)" stroke="#0A0A0D" stroke-width="0.5"/>
  <rect x="23.4" y="6.4" width="4.2" height="4.2" rx="0.9" fill="url(#sp-metal)" stroke="#0A0A0D" stroke-width="0.5"/>
  <rect x="0.2" y="0.2" width="31.6" height="31.6" rx="6.8" ry="6.8" fill="none" stroke="url(#sp-rim)" stroke-width="0.4"/>
