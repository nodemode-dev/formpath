name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Engine and test dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Engine tests
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Document engine tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the window
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Engine, pytest and Playwright
        run: |
          pip install -r backend/requirements.txt pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Window smoke (F7)
        run: python -m pytest frontend/tests/window -q -p no:cacheprovider

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app formpath_engine.py
      - run: python formpath_engine.py --selfcheck
      - name: Boot the engine and probe it
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8230 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8230/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8230/api/capabilities
          curl -sf -X POST http://127.0.0.1:8230/mcp -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | python -c "import json,sys; n=len(json.load(sys.stdin)['result']['tools']); print(n, 'tools'); sys.exit(0 if n >= 50 else 1)"

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: The harness skill's tool reference matches the engine
        run: python3 setup/agents.py sync --check

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in formpath formpath_oc_install backend/oc_install backend/boot_backend frontend/oc_install frontend/boot_frontend setup/*; do
            case "$f" in *.bat|*.py) continue ;; esac
            bash -n "$f"
          done
      - name: No em dash or emoji in tracked text
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = []
          for path in subprocess.check_output(['git', 'ls-files'], text=True).split():
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              for ch in text:
                  cp = ord(ch)
                  if cp == 0x2014 or 0x1F000 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF:
                      bad.append(f'{path}: U+{cp:04X}')
                      break
          print('\n'.join(bad) or 'clean')
          sys.exit(1 if bad else 0)
          PY
